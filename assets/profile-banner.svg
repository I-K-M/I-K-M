<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Ismael Kouddane — DevSecOps and security engineering</title>
  <desc id="desc">Engineering, production maintenance, application security and infrastructure.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#30363d" stroke-width="1" opacity=".28"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="318" rx="17" fill="none" stroke="#30363d"/>

  <circle cx="34" cy="28" r="6" fill="#f85149"/>
  <circle cx="54" cy="28" r="6" fill="#f0883e"/>
  <circle cx="74" cy="28" r="6" fill="#d29922"/>
  <text x="98" y="33" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">I-K-M / engineering</text>

  <text x="56" y="108" fill="#f0f6fc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="44" font-weight="700">ISMAEL KOUDDANE</text>
  <text x="58" y="150" fill="#f0883e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="21" font-weight="600">DEVSECOPS  ·  APPLICATION SECURITY</text>
  <text x="58" y="192" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16">software engineering · production systems · infrastructure</text>

  <g transform="translate(58 239)">
