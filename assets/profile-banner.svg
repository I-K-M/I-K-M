    <text x="20" y="27" fill="#d29922" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">WEB PLATFORMS  /  OPERATIONS  /  SECURITY</text>
  </g>

  <g transform="translate(790 70)">
    <rect width="350" height="212" rx="12" fill="#010409" stroke="#30363d"/>
    <text x="20" y="33" fill="#f0883e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">ENGINEERING</text>
    <text x="20" y="59" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">applications · integrations</text>
    <text x="20" y="95" fill="#f0883e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">OPERATIONS</text>
    <text x="20" y="121" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">deployment · maintenance</text>
    <text x="20" y="157" fill="#f0883e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">SECURITY</text>
    <text x="20" y="183" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14">hardening · AppSec · CI/CD</text>
